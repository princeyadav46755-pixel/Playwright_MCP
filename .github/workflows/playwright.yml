name: Playwright Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: QA

    env:
      BASE_URL: ${{ vars.BASE_URL }}
      USER_NAME: ${{ vars.USER_NAME }}
      PASSWORD: ${{ vars.PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Verify QA Environment
        run: |
          test -n "$BASE_URL" || { echo "BASE_URL missing"; exit 1; }
          test -n "$USER_NAME" || { echo "USER_NAME missing"; exit 1; }
          test -n "$PASSWORD" || { echo "PASSWORD missing"; exit 1; }
          echo "QA environment variables loaded successfully"

      - name: Run Playwright Tests
        run: npx playwright test
